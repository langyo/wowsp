[package]
name = "wowsp_installer_shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "SySL-1.0"
publish = false # prototype/demo crate, never published (also marks it private for cargo-deny)
description = "WoWSP installer shell: hikari UI driving the shun install flow"

[[bin]]
name = "wowsp-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true
serde_json.workspace = true
# Parsing this crate's own [package.metadata.wowsp-installer] policy
# table (build.rs) — the shun manifest loader would drop unknown keys.
toml.workspace = true
shun = "^0.4.1"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The wizard prefs file is flat TOML (see read_saved_language_in)
toml.workspace = true
shun = "^0.4.1"

# WebView2 runtime detection at loader parity: `wry::webview_version()`
# is the exact call tauri-runtime-wry gates webview creation on, so the
# shell's probe can never disagree with the gate (a registry-based probe
# accepted stale pv keys and sent broken setups into tauri's English
# "runtime missing" box). Same version line tauri already pulls in.
wry = "^0.57"

# Direct (non-workspace) deps so the shell compiles without the app's extra
# tauri features (tray-icon / image-png) — an installer exe should build lean.
tauri = { version = "^2" }
tauri-plugin-dialog = { version = "^2" }

# Done-page confirmation creates the .lnk files on demand (set_shortcuts).
mslnk = "^0.1.8"

# Uninstall UI fallback for machines without WebView2 (uninstall_egui): a
# tiny native window on the glow renderer — no wgpu, no webview.
eframe = { version = "0.33", default-features = false, features = [
    "glow",
    "default_fonts",
] }

# Removable-drive detection for the USB-mode default directory;
# native message box / shell open for the WebView2 fatal-error path;
# user-default locale read for the localized OS window title.
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# This feature is required by `cargo tauri build` and is injected by default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.shun]
product = "WoWSP"
publisher = "langyo"
# Smoke payload for plain `cargo build` (CI). Release staging overrides it
# with the real application directory: SHUN_PAYLOAD=<staged wowsp.exe dir>.
payload = "payload"

[package.metadata.shun.license-sysl]
locales = ["zh-Hans", "zh-Hant"]

[package.metadata.shun.install]
local = true
portable = true
# Shortcuts are a done-page concern: the flow itself never creates any
# ("never" here makes that structural, regardless of wizard answers) — the
# shell applies the user's choices afterwards, via `set_shortcuts` in the
# wizard and the tail of `run_headless` for silent installs.
desktop-shortcut = "never"
start-menu-shortcut = "never"
# The wowsp app detects this marker beside its executable (paths.rs).
portable-marker = ".portable"
main-exe = "wowsp.exe"

# WebView2 fallback policy for machines the loader reports as runtime-less
# (stamped by build.rs into wv2-policy.json; see Webview2Policy in main.rs).
# `silent-install`: silently run the carried Evergreen offline installer
# before anything renders — the -webview2 flavor carries one under the
# payload's `webview2/` subtree; the lite flavor carries nothing, so the
# knob is a no-op there. `warn-missing`: when the machine still has no
# runtime and nothing was carried, the native degrade notice (message
# box + link) points at Microsoft's official download page. Both
# default on; set either to false to turn the behavior off per build.
[package.metadata.wowsp-installer.webview2]
silent-install = true
warn-missing = true
