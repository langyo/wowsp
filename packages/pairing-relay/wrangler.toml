# WoWSP worker site — the dynamic half of wowsp.langyo.xyz AND the
# host of its static site.
#
# The worker is RUST compiled to WebAssembly (crates/relay-core carries
# the protocol/policy; crates/relay-worker is the wasm entry). Building
# requires the one-time tool install (see README.md ▶ Deploy):
#
#   cargo install worker-build@0.8.7 --locked  # 0.9+ needs worker >= 0.9; relay pins ^0.8
#
# then `npx wrangler deploy` / `pnpm --filter @wowsp/pairing-relay deploy`
# (the Deploy Site workflow does exactly this on every master push
# touching this package — see README.md ▶ Deploy; the manual command
# remains the hotfix path for unmerged code).
# Local dev: `pnpm --filter @wowsp/pairing-relay dev` (= `wrangler dev`,
# builds the wasm via the [build] command below).
#
# HOSTING MODEL (see README.md ▶ Site hosting model): the hostname is
# bound to this worker as a Workers Custom Domain, so the worker owns
# every path. The static site (website + docs) rides the [assets] layer
# below — a gitignored build output generated by
# scripts/build_worker_site.py from the Deploy Site workflow's merged
# artifact (`just bundle-site` builds a local website-only copy). Assets
# are served FIRST: a request that matches a file — or the SPA fallback
# for unknown browser navigations — never invokes worker code. The
# dynamic paths are pulled back in front via `run_worker_first`: the
# worker API (/api*), minus the doc-carrying digest channels (the
# per-channel `!` negations — see the [assets] section and the
# build-generated _redirects). The hikari console pages /feedback
# and /erp (packages/console build) serve from the assets layer like any
# static file. The assets shell's loader pulls the heavy entry JS/CSS from the
# GitHub Pages mirror (langyo.github.io/wowsp) first and falls back to
# the worker's own /wowsp/** copy (same build, same hashes — the Deploy
# Site workflow publishes both artifacts from one run), so the heavy app
# bundle stays on the Pages mirror while the worker carries the shell,
# the public files and the docs; GitHub Pages stays a live backup host.
# The apps hardcode https://wowsp.langyo.xyz — see
# packages/app/tauri/src/commands/gateway/urls.rs BUILTIN_WORKER_ROOT_URL.
# Development can override the endpoint with the WOWSP_RELAY_URL env var.

name = "wowsp-pairing"
main = "crates/relay-worker/build/worker/shim.mjs"
compatibility_date = "2026-01-15"

# The Custom Domain binding that hands the worker the whole hostname
# (this REPLACES the pre-assets zone routes /api*, /feedback*, /erp* —
# with [assets] attached, path-level routing happens through
# run_worker_first instead). Re-deploying keeps the binding idempotent;
# Cloudflare manages the hostname's DNS record while it exists.
routes = [
  { pattern = "wowsp.langyo.xyz", custom_domain = true }
]

# The static site — see the header comment and
# scripts/build_worker_site.py. The directory is GITIGNORED build output
# (root: the loader-injected SPA shell + public files; /wowsp/**: the
# full-build fallback copy).
#
# not_found_handling: unknown paths serve the root index.html shell.
# With compatibility_date ≥ 2025-04-01, browser NAVIGATION requests
# resolve through the assets layer directly. /feedback and /erp are now
# REAL hikari console pages (packages/console → dist/console, copied to
# the assets root by scripts/build_worker_site.py) — they serve from the
# assets layer like any static file, so only the worker API stays in
# front of it.
[assets]
directory = "./assets"
not_found_handling = "single-page-application"
# Digest lookups are NEGATED back to the assets layer PER CHANNEL —
# only the channels that actually carry docs (negative patterns take
# precedence over the /api* catch-all): a served lookup is pure static
# traffic, answered by the BUILD-GENERATED _redirects (exact-path rules
# from the tracked digests/ tree, written to the assets root by
# scripts/build_worker_site.py, which FAILS the build when a channel
# has docs but no negation here) — no worker invocation, no budget,
# rate limiter or KV quota on the path.
#
# The negation must stay SCOPED, never a blanket !/api/digests*: with
# not_found_handling = "single-page-application" an asset miss serves
# the SPA shell (200 text/html) and NEVER reaches the worker — a
# blanket negation turned every unpublished-channel lookup into a
# 229KB HTML 200 instead of the worker's gated 404, which is the app's
# absent-channel signal (30-min suppression). Channels WITHOUT docs
# keep worker-first and answer the gated 404 through the digests
# handler. A channel's FIRST publish must add its two negation entries
# here (the build guard enforces it) and extend
# DIGEST_PUBLISHED_CHANNELS for its own miss fallback.
# "/gateway*" — the account-routed battle-push namespace
# (crates/relay-worker/src/gateway.rs; mobile-gateway wave). Nothing
# static ever lives under /gateway, so no per-path negation is needed.
# "/ipfs*" — the cache-mesh block store's IPFS-gateway alias
# (docs/en/designs/cache-mesh.md §4.2; crates/relay-worker/src/
# blocks.rs). OUTSIDE /api* on purpose (IPFS gateway path convention),
# so it needs its own worker-first entry: without it the assets layer
# answers every /ipfs/<cid> with the SPA shell and the worker route is
# unreachable. Nothing static ever lives under /ipfs either.
run_worker_first = ["/api*", "!/api/digests/app", "!/api/digests/app/*", "!/api/digests/data", "!/api/digests/data/*", "!/api/digests/mod-hub", "!/api/digests/mod-hub/*", "/gateway*", "/ipfs*"]
# The ASSETS binding lets the worker fetch its own asset files by path
# (crates/relay-worker/src/digests.rs — serves the doc-less channels'
# gated 404; the doc-carrying channels' hits are answered statically
# by the generated _redirects).
binding = "ASSETS"

[build]
command = "worker-build --release crates/relay-worker"

# Feedback pipeline KV (rate-limit counters + Feishu token/base caches).
# Namespace: `npx wrangler kv namespace create FEEDBACK_KV`.
# The replay-share collection ALSO lives here: the wanted ruleset in key
# `replays:wanted` (maintainer sets/updates via wrangler — absent or
# empty rules = collection CLOSED) and the replay rate-limit counters
# under prefix `replays:rl:` (uploads/archive-fetch/check quotas; see
# crates/relay-core/src/replay.rs).
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "a523e16e116b4f9fa5878c721c133028"

# Battle-push KV mirror (the GatewayChannel DO writes battle:<route>
# rows here, TTL 1 h — see crates/relay-worker/src/gateway.rs). A
# SECOND binding over the EXISTING FEEDBACK_KV namespace: two bindings
# may legally point at one namespace, and the gateway's tiny mirror
# rows share the same (per-namespace) free quota. If the push namespace
# ever needs its own traffic profile, split it —
#   npx wrangler kv namespace create GATEWAY_KV
# — and repoint ONLY this id; the code keys everything off the binding
# name, so nothing else changes.
[[kv_namespaces]]
binding = "GATEWAY_KV"
id = "a523e16e116b4f9fa5878c721c133028"

# Cache-mesh KV (the /api/lookup, /api/blocks, /ipfs and /api/peers
# namespaces — crates/relay-worker/src/{lookup,blocks,peers}.rs;
# docs/en/designs/cache-mesh.md). A THIRD binding over the SAME
# FEEDBACK_KV namespace (the two-bindings-one-namespace pattern
# above). What lives here after the review quota fixes
# (2026-11-21): the ONE-document own peer registry (peers:own),
# the cached upstream peer list (peers:upstream), node:id and the
# peer-announce rate counters — all tiny and announce-bounded. The
# heavy paths deliberately do NOT touch KV anymore: block envelopes
# ride R2 (LOOKUP_R2 below) and the per-IP lookup budget rides the
# LookupRate Durable Object (LOOKUP_RATE below) — a KV counter there
# would have PUT once per request against this namespace's shared
# 1000-writes/day free budget (the 2026-10-22 incident shape). The hot
# lookup path is edge-cached in front of everything anyway. Split the
# same way if the mesh ever needs its own traffic profile:
#   npx wrangler kv namespace create LOOKUP_KV
[[kv_namespaces]]
binding = "LOOKUP_KV"
id = "a523e16e116b4f9fa5878c721c133028"

# Release-digest store: RETIRED from KV on 2026-10-22 — the docs ride
# the [assets] layer now (assets/api/digests/** from the tracked
# packages/pairing-relay/digests/ tree; see crates/relay-core/src/
# digests.rs and scripts/publish_digests.py). The retired namespace id
# was 15ffe26d12d44b52a0649c375ae975fb — safe to delete from the
# dashboard once the dust settles.

# Replay-share shard storage — one `shards/<anonId>.tar.zstd` blob per
# contributor (the upload body streams straight in, the archive routes
# stream straight out). The maintainer must create the bucket ONCE
# before the first deploy that binds it:
#   npx wrangler r2 bucket create wowsp-replay-shards
# (Free tier: 10 GB stored — the 8 GiB watermark cap in
# relay-core's replay policy keeps the collection inside it.)
[[r2_buckets]]
binding = "REPLAY_R2"
bucket_name = "wowsp-replay-shards"

# Cache-mesh block storage — one envelope-JSON object per CID (the
# /api/lookup fill store + the /api/blocks and /ipfs read family; see
# crates/relay-worker/src/blocks.rs). Blocks moved here from KV for
# quota economics (review finding 1b, 2026-11-21): fills are WRITE
# traffic the free KV namespace budget (1000/day) cannot absorb,
# while R2's free tier allows 1M class-A ops/month. Expiry is LAZY
# (TTL + 24 h grace checked on read; expired reads delete
# best-effort; refills overwrite) — deliberately no sweep cron. The
# maintainer must create the bucket ONCE before the first deploy that
# binds it:
#   npx wrangler r2 bucket create wowsp-lookup-blocks
[[r2_buckets]]
binding = "LOOKUP_R2"
bucket_name = "wowsp-lookup-blocks"

# SQLite-backed Durable Object classes — what the Workers FREE tier
# provisions. (The pairing Room + Directory classes were RETIRED with
# the PIN pairing mode on 2026-11-13: migration v5 deletes them and
# their bindings are gone — the account-routed gateway push below is
# the live phone↔desktop channel.)
#   ReplayIndex — the singleton ("index", idFromName) replay-share ledger:
#                 per-hash rows (contributor/status/rule), per-contributor
#                 meta + token hashes, per-rule counters and the staged-
#                 bytes watermark. Alarm-free (drained rows stay forever;
#                 see crates/relay-worker/src/replay_index.rs).
#   GatewayAuth   — the singleton ("auth", idFromName) push-session
#                 registry (v4): single-use /gateway/session tickets +
#                 per-IP password failure counters, TTL alarm sweep.
#   GatewayChannel — one per push route id ("r:<realm>:<accountId>",
#                 v4): publisher presence, subscriber fan-out (cap 32),
#                 last-battle snapshot retention alarm, battle:<route>
#                 KV mirror writes.
#   LookupRate   — the cache-mesh lookup budget (v6): one SQLite shard
#                 per (hour bucket, IP) via idFromName — the §3.5
#                 per-IP hourly counter, GET /spend?limit=<n> → 200 |
#                 429, self-deleting alarm sweep at hour + 2 h. NOT a
#                 KV counter on purpose (see the LOOKUP_KV comment
#                 above); see crates/relay-worker/src/lookup_rate.rs.
#
# Migrations v1/v2 declared the TypeScript era's Room + Directory classes
# (v3 adds ReplayIndex, v4 the gateway-push pair). v5 DELETES Room +
# Directory: their PIN-pairing routes and code paths are gone from the
# worker code, so the classes must go from the binding set too — the
# deleted_classes migration drops their (tiny, transient) storage.
[[durable_objects.bindings]]
name = "REPLAY_INDEX"
class_name = "ReplayIndex"

[[durable_objects.bindings]]
name = "GATEWAY_AUTH"
class_name = "GatewayAuth"

[[durable_objects.bindings]]
name = "GATEWAY_CHANNEL"
class_name = "GatewayChannel"

[[durable_objects.bindings]]
name = "LOOKUP_RATE"
class_name = "LookupRate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReplayIndex"]

# v4 adds the battle-push namespace's two classes (mobile-gateway wave;
# see crates/relay-worker/src/gateway.rs).
[[migrations]]
tag = "v4"
new_sqlite_classes = ["GatewayAuth", "GatewayChannel"]

# v5 deletes the retired pairing classes (PIN-pairing retirement,
# 2026-11-13). The deploy after this change drops the classes and their
# storage from the live worker.
[[migrations]]
tag = "v5"
deleted_classes = ["Room", "Directory"]

# v6 adds the cache-mesh lookup budget shard (see the LookupRate class
# comment above). NOTE for self-hosts: a gateway-only selfhost that
# later turns the mesh ON (LOOKUP_ENABLED) must add this binding AND
# its own migration entry to its chain — see
# wrangler.selfhost.toml.example.
[[migrations]]
tag = "v6"
new_sqlite_classes = ["LookupRate"]

# Optional operator switch (dashboard ▶ Settings ▶ Variables, or here
# under [vars]); not required:
#   GATEWAY_NOTICE   — free-form operator message surfaced by /api/health.
# TURNSTILE_SITEKEY is PUBLIC by design (it rides GET /api/feedback/config
# to the console) — the matching secret key lives in the worker secrets
# (TURNSTILE_SECRET).
# REPLAY_ADMIN_KEY (secret, optional) — the machine gate on
# /api/replays/admin/*: the replay-drain CLI sends it as x-admin-key.
#   npx wrangler secret put REPLAY_ADMIN_KEY   (high-entropy random)
# Unset = the admin routes answer to a logged-in erp session only.
# Widget "wowsp-feedback" (managed mode, wowsp.langyo.xyz + localhost).
#
# ── /gateway/* battle push (crates/relay-worker/src/gateway.rs) ──────
# No NEW vars on the official node: the gateway health doc reads
# GATEWAY_TURNSTILE_SITEKEY first and falls back to TURNSTILE_SITEKEY
# above (same for the siteverify secrets GATEWAY_TURNSTILE_SECRET →
# TURNSTILE_SECRET), so push sessions are gated by the SAME widget as
# the feedback form. Self-hosts that want their own widget set
# GATEWAY_TURNSTILE_SITEKEY here instead (see
# wrangler.selfhost.toml.example). The widget's hostname allowlist must
# cover tauri.localhost (desktop webview), asset.localhost (Android)
# and localhost (wrangler dev) for the apps to pass challenges.
# GATEWAY_PASSWORD (secret, OPTIONAL) — when set, /gateway/session also
# demands it (constant-time compare; 5 failures per minute locks the
# source IP for 5 minutes):
#   npx wrangler secret put GATEWAY_PASSWORD
# Absent ⇒ password off. The official node stays Turnstile-only;
# private/self-hosted nodes may prefer password-only (no widget).
# Console access gate (two tiers, no open mode):
#   ADMINS  — ERP_ALLOWED_OPEN_IDS (comma-separated, secret or var;
#            `wrangler secret put` recommended) ∪ FEEDBACK_ADMIN_OPEN_ID.
#            Full control incl. the 人员管理 surface. SET THIS to the
#            maintainer's own open_id BEFORE deploying — an empty gate
#            admits nobody (find your open_id via `wrangler tail` on a
#            denied login attempt, or the Feishu admin console).
#   MEMBERS — granted from the console's 人员管理 page, stored in the
#            FEEDBACK_KV row `erp:members`; view access only.
# The people page's Feishu user listing additionally needs the app to
# hold the contact scopes (contact:user.base:readonly +
# contact:department.base:readonly) and 通讯录数据权限 set to 全部成员
# in the Feishu developer console — grant them there when first using it.
[vars]
TURNSTILE_SITEKEY = "0x4AAAAAAFJMAGDRhyraDqpe"
# The latest published release, prefilling the console feedback form's
# version dropdown for browser visitors (desktop links carry their own
# build). scripts/sync_versions.py --check enforces this stays equal to
# the other six derived version slots (root package.json is the source of
# truth).
FEEDBACK_LATEST_VERSION = "0.6.11"
# The digest channels this deployment actually serves (comma separated,
# subset of app/mod-hub/res/data). Lookups for any other VALID channel
# answer 404 BEFORE the read budget and the asset fetch — extend only
# after the matching publisher has written a doc into the tracked
# packages/pairing-relay/digests/ tree (2026-10-22: the app fleet
# polling never-published channels burned the store's daily read
# quota; see crates/relay-core/src/digests.rs).
DIGEST_PUBLISHED_CHANNELS = "app,data,mod-hub"
# ── QQ 通知机器人（FROZEN 2026-10-24，维护者决定）────────────────────
# 官方通道对群提醒的可达性不可靠、账号风险高——整条链路（出站通知 +
# 入站回调）由 QQBOT_NOTIFY 变量总闸控制，**本文件不设该变量 = 冻结**：
# notify_accepted/notify_status 静默跳过，回调端点答 404（平台会自动
# 退役 webhook）。代码与配额策略原样保留，未删除任何东西。
# 复活：[vars] 加 QQBOT_NOTIFY = "1"，并补齐下面的凭证。
# QQBOT_APPID / QQBOT_SECRET — 开放平台凭证（wrangler secret put）。
# 回调验签的 Ed25519 密钥按官方方案直接从 Secret 派生（wiki
# event-emit.html / sign.html：Secret 翻倍到 32 字节作种子），无需任何
# 控制台密钥；把回调地址设为 https://wowsp.langyo.xyz/api/qqbot/callback
# 即可通过平台的 URL 校验。
# ── 爱发电赞助名单（可选，缺失即 cron 静默跳过、/api/sponsors 答 503、
#    app 端用本地 last-good 缓存兜底）────────────────────────────────
# AFDIAN_USER_ID — 创作者 user_id（公开句柄性质，非机密；与 token 一起
# 参与 open API 的 md5 签名）。AFDIAN_API_TOKEN 是 worker secret：
#   npx wrangler secret put AFDIAN_API_TOKEN
# 每日 cron 拉取 query-sponsor + query-order，归并成公开名单写入
# FEEDBACK_KV 的 sponsors:afdian 槽（内容不变不写）。
AFDIAN_USER_ID = "174593ccd13211e8831352540025c377"
# GATEWAY_NOTICE = ""
# ── 缓存网格 cache-mesh（docs/en/designs/cache-mesh.md）──────────────
# 这组变量遵循与上面 QQBOT_NOTIFY 相同的纪律：**本文件不写 = 默认开**。
# 一个写进 [vars] 的值就是部署值——要关闭某能力时才显式添加：
#   LOOKUP_ENABLED = "0"        — 总闸：关掉 /api/lookup、/api/blocks、
#                                  /ipfs、/api/peers（/api/health 的
#                                  capabilities 同步降为 false；网关推送
#                                  不受影响）。
#   LOOKUP_SYNC = "0"           — 关闭 §5.4 的对等节点透传导送
#                                  （本地缓存未命中时不再询问 peers）。
#   PEERS_ACCEPT_ANNOUNCES = "false" — 关闭本节点的 announce 受理
#                                  （§5.2.5，注册表变只读）。
#   SYNC_PEERS_MAX = "3"        — 透传时最多询问的 peer 数（默认 3）。
#   LOOKUP_RATE_PER_HOUR = "240" — /api/lookup 的每 IP 小时预算（§3.5）。
#   PEERS_UPSTREAM — 官方节点保持未设（它自己就是种子节点）；自建节点
#                                  设为 https://wowsp.langyo.xyz 订阅广播
#                                  名单（见 wrangler.selfhost.toml.example）。
# 官方节点的 mesh 角色显式声明（默认 community；官方部署必须 official）。
NODE_ROLE = "official"

# 2026-11-25 KV quota incident (emergency, reversible): the v0.6.11 client
# routes every stats lookup through /api/lookup/fetch, and each cold miss
# costs two KV reads (one of them the never-written `peers:upstream` row);
# the empty peer registry also keeps the client autodiscover loop alive,
# writing one KV counter per /api/peers edge miss every ten minutes per
# client. By 09:40Z on 2026-11-25 that had spent 55,029 KV reads (55% of
# the daily free tier) and 510 writes (51%). Flip this switch back off once
# the client-side caching/backoff fix ships (or the mesh moves off this
# worker).
LOOKUP_ENABLED = "0"

# 每日 19:33 UTC（北京 03:33）拉一次爱发电赞助者/订单——刷新
# /api/sponsors 的 KV 文档（src/sponsors.rs；变更才写，免费版 KV
# 1000 写/天绰绰有余）。
[triggers]
crons = ["33 19 * * *"]
