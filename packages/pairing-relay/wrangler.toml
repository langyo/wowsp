# WoWSP pairing gateway — the API half of wowsp.langyo.xyz.
#
# The worker is RUST compiled to WebAssembly (crates/relay-core carries
# the protocol/policy; crates/relay-worker is the wasm entry). Building
# requires the one-time tool install (see README.md ▶ Deploy):
#
#   cargo install -t worker-build worker-build
#
# then `npx wrangler deploy` / `pnpm --filter @wowsp/pairing-relay deploy`
# (owner's manual step). Local dev: `pnpm --filter @wowsp/pairing-relay dev`
# (= `wrangler dev`, builds the wasm via the [build] command below).
#
# The worker answers ONLY the pairing API under
# https://wowsp.langyo.xyz/api* — the `routes` entry below. Workers
# Routes take precedence over the GitHub Pages custom domain bound to
# the same hostname, so the WEBSITE (HTML + all assets, including /docs)
# is served by GitHub Pages at the same address and Cloudflare stays out
# of the page/heavy-download path entirely. The DNS record for
# wowsp.langyo.xyz is therefore the proxied CNAME to
# `langyo.github.io` (GitHub Pages). The apps hardcode
# https://wowsp.langyo.xyz — see
# packages/app/tauri/src/commands/pairing_relay.rs BUILTIN_RELAY_ROOT_URL.
# Development can override the endpoint with the WOWSP_RELAY_URL env var.

name = "wowsp-pairing"
main = "crates/relay-worker/build/worker/shim.mjs"
compatibility_date = "2026-01-15"

# API route on the site's hostname (see the header comment). The zone's
# DNS for this hostname must be the proxied GitHub Pages CNAME.
routes = [
  { pattern = "wowsp.langyo.xyz/api*", zone_name = "langyo.xyz" },
]

[build]
command = "worker-build --release crates/relay-worker"

# Feedback pipeline KV (rate-limit counters + Feishu token/base caches).
# Namespace: `npx wrangler kv namespace create FEEDBACK_KV`.
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "a523e16e116b4f9fa5878c721c133028"

# Two SQLite-backed Durable Object classes — what the Workers FREE tier
# provisions:
#   Room      — one per pairing room (DO id = the room's 64-hex key):
#               in-memory rendezvous + byte pipes; storage is used only
#               for the 15-min idle alarm.
#   Directory — the singleton ("codes", idFromName) 6-digit pairing-code
#               registry: code → {room, hostId} bindings + per-IP rate
#               state in storage with a TTL alarm.
#
# Migrations v1/v2 are the SAME class declarations the TypeScript worker
# deployed (names and SQLite backing unchanged) — the Rust rewrite needs
# NO new migration tag: deploying over the live worker applies cleanly.
# (Storage rows in the old v1 key format are garbage-collected lazily on
# the Directory's first load — see crates/relay-worker/src/directory.rs.)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Optional operator switches (dashboard ▶ Settings ▶ Variables, or here
# under [vars]); neither is required:
#   GATEWAY_UPSTREAM — absolute https/wss URL of the real exchange. When
#       set, /api/health reports it as "upstream" and clients follow it
#       (forwarding-station hand-off — no app redeploy needed).
#   GATEWAY_NOTICE   — free-form operator message surfaced by /api/health.
# TURNSTILE_SITEKEY is PUBLIC by design (it rides the /feedback HTML) —
# the matching secret key lives in the worker secrets (TURNSTILE_SECRET).
# Widget "wowsp-feedback" (managed mode, wowsp.langyo.xyz + localhost).
[vars]
TURNSTILE_SITEKEY = "0x4AAAAAAFJMAGDRhyraDqpe"
# The latest published release, prefilling the /feedback form's version
# combobox for browser visitors (desktop links carry their own build).
# scripts/check_versions.py enforces this stays equal to the other seven
# version fields.
FEEDBACK_LATEST_VERSION = "0.5.3"
# ── QQ 通知机器人（可选，缺失即整链路静默停用）───────────────────────
# QQBOT_APPID / QQBOT_SECRET — 开放平台凭证（wrangler secret put）。
# 回调验签的 Ed25519 密钥按官方方案直接从 Secret 派生（wiki
# event-emit.html / sign.html：Secret 翻倍到 32 字节作种子），无需任何
# 控制台密钥；把回调地址设为 https://wowsp.langyo.xyz/api/qqbot/callback
# 即可通过平台的 URL 校验。
# GATEWAY_UPSTREAM = ""
# GATEWAY_NOTICE = ""
