# WoWSP pairing gateway — the dynamic half of wowsp.langyo.xyz AND the
# host of its static site.
#
# The worker is RUST compiled to WebAssembly (crates/relay-core carries
# the protocol/policy; crates/relay-worker is the wasm entry). Building
# requires the one-time tool install (see README.md ▶ Deploy):
#
#   cargo install worker-build
#
# then `npx wrangler deploy` / `pnpm --filter @wowsp/pairing-relay deploy`
# (the Deploy Site workflow does exactly this on every master push
# touching this package — see README.md ▶ Deploy; the manual command
# remains the hotfix path for unmerged code).
# Local dev: `pnpm --filter @wowsp/pairing-relay dev` (= `wrangler dev`,
# builds the wasm via the [build] command below).
#
# HOSTING MODEL (see README.md ▶ Site hosting model): the hostname is
# bound to this worker as a Workers Custom Domain, so the worker owns
# every path. The static site (website + docs) rides the [assets] layer
# below — a gitignored build output generated by
# scripts/build_worker_site.py from the Deploy Site workflow's merged
# artifact (`just bundle-site` builds a local website-only copy). Assets
# are served FIRST: a request that matches a file — or the SPA fallback
# for unknown browser navigations — never invokes worker code. The
# dynamic paths are pulled back in front via `run_worker_first`: the
# pairing API (/api*) plus the two server-rendered pages (/feedback,
# /erp). The assets shell's loader pulls the heavy entry JS/CSS from the
# GitHub Pages mirror (langyo.github.io/wowsp) first and falls back to
# the worker's own /wowsp/** copy (same build, same hashes — the Deploy
# Site workflow publishes both artifacts from one run), so the heavy app
# bundle stays on the Pages mirror while the worker carries the shell,
# the public files and the docs; GitHub Pages stays a live backup host.
# The apps hardcode https://wowsp.langyo.xyz — see
# packages/app/tauri/src/commands/pairing_relay/ BUILTIN_RELAY_ROOT_URL.
# Development can override the endpoint with the WOWSP_RELAY_URL env var.

name = "wowsp-pairing"
main = "crates/relay-worker/build/worker/shim.mjs"
compatibility_date = "2026-01-15"

# The Custom Domain binding that hands the worker the whole hostname
# (this REPLACES the pre-assets zone routes /api*, /feedback*, /erp* —
# with [assets] attached, path-level routing happens through
# run_worker_first instead). Re-deploying keeps the binding idempotent;
# Cloudflare manages the hostname's DNS record while it exists.
routes = [
  { pattern = "wowsp.langyo.xyz", custom_domain = true }
]

# The static site — see the header comment and
# scripts/build_worker_site.py. The directory is GITIGNORED build output
# (root: the loader-injected SPA shell + public files; /wowsp/**: the
# full-build fallback copy).
#
# not_found_handling: unknown paths serve the root index.html shell.
# With compatibility_date ≥ 2025-04-01, browser NAVIGATION requests
# resolve through the assets layer directly. /feedback and /erp are now
# REAL hikari console pages (packages/console → dist/console, copied to
# the assets root by scripts/build_worker_site.py) — they serve from the
# assets layer like any static file, so only the pairing API stays in
# front of it.
[assets]
directory = "./assets"
not_found_handling = "single-page-application"
run_worker_first = ["/api*"]
# The ASSETS binding lets the worker fetch its own asset files by path
# (crates/relay-worker/src/digests.rs proxies /api/digests/** through
# it behind an edge cache — the digest docs are static files under
# assets/api/digests/, copied from the tracked
# packages/pairing-relay/digests/ tree by scripts/build_worker_site.py).
binding = "ASSETS"

[build]
command = "worker-build --release crates/relay-worker"

# Feedback pipeline KV (rate-limit counters + Feishu token/base caches).
# Namespace: `npx wrangler kv namespace create FEEDBACK_KV`.
# The replay-share collection ALSO lives here: the wanted ruleset in key
# `replays:wanted` (maintainer sets/updates via wrangler — absent or
# empty rules = collection CLOSED) and the replay rate-limit counters
# under prefix `replays:rl:` (uploads/archive-fetch/check quotas; see
# crates/relay-core/src/replay.rs).
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "a523e16e116b4f9fa5878c721c133028"

# Release-digest store: RETIRED from KV on 2026-10-22 — the docs ride
# the [assets] layer now (assets/api/digests/** from the tracked
# packages/pairing-relay/digests/ tree; see crates/relay-core/src/
# digests.rs and scripts/publish_digests.py). The retired namespace id
# was 15ffe26d12d44b52a0649c375ae975fb — safe to delete from the
# dashboard once the dust settles.

# Replay-share shard storage — one `shards/<anonId>.tar.zstd` blob per
# contributor (the upload body streams straight in, the archive routes
# stream straight out). The maintainer must create the bucket ONCE
# before the first deploy that binds it:
#   npx wrangler r2 bucket create wowsp-replay-shards
# (Free tier: 10 GB stored — the 8 GiB watermark cap in
# relay-core's replay policy keeps the collection inside it.)
[[r2_buckets]]
binding = "REPLAY_R2"
bucket_name = "wowsp-replay-shards"

# Three SQLite-backed Durable Object classes — what the Workers FREE tier
# provisions:
#   Room        — one per pairing room (DO id = the room's 64-hex key):
#                 in-memory rendezvous + byte pipes; storage is used only
#                 for the 15-min idle alarm.
#   Directory   — the singleton ("codes", idFromName) 6-digit pairing-code
#                 registry: code → {room, hostId} bindings + per-IP rate
#                 state in storage with a TTL alarm.
#   ReplayIndex — the singleton ("index", idFromName) replay-share ledger:
#                 per-hash rows (contributor/status/rule), per-contributor
#                 meta + token hashes, per-rule counters and the staged-
#                 bytes watermark. Alarm-free (drained rows stay forever;
#                 see crates/relay-worker/src/replay_index.rs).
#
# Migrations v1/v2 are the SAME class declarations the TypeScript worker
# deployed (names and SQLite backing unchanged) — the Rust rewrite needed
# NO new migration tag: deploying over the live worker applies cleanly.
# v3 adds the ReplayIndex class (new in the replay-share wave).
# (Storage rows in the old v1 key format are garbage-collected lazily on
# the Directory's first load — see crates/relay-worker/src/directory.rs.)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "REPLAY_INDEX"
class_name = "ReplayIndex"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReplayIndex"]

# Optional operator switches (dashboard ▶ Settings ▶ Variables, or here
# under [vars]); neither is required:
#   GATEWAY_UPSTREAM — absolute https/wss URL of the real exchange. When
#       set, /api/health reports it as "upstream" and clients follow it
#       (forwarding-station hand-off — no app redeploy needed).
#   GATEWAY_NOTICE   — free-form operator message surfaced by /api/health.
# TURNSTILE_SITEKEY is PUBLIC by design (it rides the /feedback HTML) —
# the matching secret key lives in the worker secrets (TURNSTILE_SECRET).
# REPLAY_ADMIN_KEY (secret, optional) — the machine gate on
# /api/replays/admin/*: the replay-drain CLI sends it as x-admin-key.
#   npx wrangler secret put REPLAY_ADMIN_KEY   (high-entropy random)
# Unset = the admin routes answer to a logged-in erp session only.
# Widget "wowsp-feedback" (managed mode, wowsp.langyo.xyz + localhost).
# ERP_OPEN_ACCESS (audit M-6 switch) — the maintainer's explicit choice for
# THIS deployment: the Feishu app is org-scoped, so org membership IS the
# authorization ("能登录飞书组织 = 有权进后台"); the console therefore runs
# in the legacy any-app-user gate by default. To tighten later, remove this
# var (the code default is fail-closed) or set ERP_ALLOWED_OPEN_IDS.
[vars]
ERP_OPEN_ACCESS = "1"
TURNSTILE_SITEKEY = "0x4AAAAAAFJMAGDRhyraDqpe"
# The latest published release, prefilling the /feedback form's version
# combobox for browser visitors (desktop links carry their own build).
# scripts/sync_versions.py --check enforces this stays equal to the other
# six derived version slots (root package.json is the source of truth).
FEEDBACK_LATEST_VERSION = "0.6.5"
# The digest channels this deployment actually serves (comma separated,
# subset of app/mod-hub/res/data). Lookups for any other VALID channel
# answer 404 BEFORE the read budget and the asset fetch — extend only
# after the matching publisher has written a doc into the tracked
# packages/pairing-relay/digests/ tree (2026-10-22: the app fleet
# polling never-published channels burned the store's daily read
# quota; see crates/relay-core/src/digests.rs).
DIGEST_PUBLISHED_CHANNELS = "app"
# ── QQ 通知机器人（可选，缺失即整链路静默停用）───────────────────────
# QQBOT_APPID / QQBOT_SECRET — 开放平台凭证（wrangler secret put）。
# 回调验签的 Ed25519 密钥按官方方案直接从 Secret 派生（wiki
# event-emit.html / sign.html：Secret 翻倍到 32 字节作种子），无需任何
# 控制台密钥；把回调地址设为 https://wowsp.langyo.xyz/api/qqbot/callback
# 即可通过平台的 URL 校验。
# ── 爱发电赞助名单（可选，缺失即 cron 静默跳过、/api/sponsors 答 503、
#    app 端用本地 last-good 缓存兜底）────────────────────────────────
# AFDIAN_USER_ID — 创作者 user_id（公开句柄性质，非机密；与 token 一起
# 参与 open API 的 md5 签名）。AFDIAN_API_TOKEN 是 worker secret：
#   npx wrangler secret put AFDIAN_API_TOKEN
# 每日 cron 拉取 query-sponsor + query-order，归并成公开名单写入
# FEEDBACK_KV 的 sponsors:afdian 槽（内容不变不写）。
AFDIAN_USER_ID = "174593ccd13211e8831352540025c377"
# GATEWAY_UPSTREAM = ""
# GATEWAY_NOTICE = ""

# 每日 19:33 UTC（北京 03:33）拉一次爱发电赞助者/订单——刷新
# /api/sponsors 的 KV 文档（src/sponsors.rs；变更才写，免费版 KV
# 1000 写/天绰绰有余）。
[triggers]
crons = ["33 19 * * *"]
