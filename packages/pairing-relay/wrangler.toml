# WoWSP site + pairing gateway — one Cloudflare Worker.
#
# The worker is RUST compiled to WebAssembly (crates/relay-core carries
# the protocol/policy; crates/relay-worker is the wasm entry) AND hosts
# the website's static assets (the [assets] block below — Pages+Worker
# in one service). Building requires the one-time tool install (see
# README.md ▶ Deploy):
#
#   cargo install -t worker-build worker-build
#
# then bundle the site (see the justfile `bundle-site` recipe — builds
# packages/website + docs into ./assets) and deploy:
#
#   just bundle-site
#   WASM_BINDGEN_BIN="$(command -v wasm-bindgen)" pnpm exec wrangler deploy
#
# (owner's manual step). Local dev: `pnpm --filter @wowsp/pairing-relay
# dev` (= `wrangler dev`, builds the wasm via the [build] command below).
#
# Production is served at the custom domain wowsp.langyo.xyz (bound in
# the Cloudflare dashboard after deploy; the desktop app and the phone
# app hardcode https://wowsp.langyo.xyz — see
# packages/app/tauri/src/commands/pairing_relay.rs BUILTIN_RELAY_ROOT_URL).
# GitHub Pages remains a backup mirror only. Development can override
# the endpoint with the WOWSP_RELAY_URL env var.

name = "wowsp-pairing"
main = "crates/relay-worker/build/worker/shim.mjs"
compatibility_date = "2026-01-15"

[build]
command = "worker-build --release crates/relay-worker"

# The WEBSITE this worker serves: the HTML shell answers every non-API
# path (SPA fallback), while BUILT assets (JS/CSS/images) load from the
# GitHub Pages mirror (langyo.github.io/wowsp) via absolute URLs — see
# justfile `bundle-site` (WOWSP_SITE_ASSET_BASE). /docs redirects to the
# Pages-hosted docs, and run_worker_first routes /api + /docs into the
# worker; everything else resolves statically. `assets/` is generated
# (gitignored).
[assets]
directory = "./assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/docs", "/docs/*"]

# Two SQLite-backed Durable Object classes — what the Workers FREE tier
# provisions:
#   Room      — one per pairing room (DO id = the room's 64-hex key):
#               in-memory rendezvous + byte pipes; storage is used only
#               for the 15-min idle alarm.
#   Directory — the singleton ("codes", idFromName) 6-digit pairing-code
#               registry: code → {room, hostId} bindings + per-IP rate
#               state in storage with a TTL alarm.
#
# Migrations v1/v2 are the SAME class declarations the TypeScript worker
# deployed (names and SQLite backing unchanged) — the Rust rewrite needs
# NO new migration tag: deploying over the live worker applies cleanly.
# (Storage rows in the old v1 key format are garbage-collected lazily on
# the Directory's first load — see crates/relay-worker/src/directory.rs.)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Optional operator switches (dashboard ▶ Settings ▶ Variables, or here
# under [vars]); neither is required:
#   GATEWAY_UPSTREAM — absolute https/wss URL of the real exchange. When
#       set, /api/health reports it as "upstream" and clients follow it
#       (forwarding-station hand-off — no app redeploy needed).
#   GATEWAY_NOTICE   — free-form operator message surfaced by /api/health.
[vars]
# GATEWAY_UPSTREAM = ""
# GATEWAY_NOTICE = ""
