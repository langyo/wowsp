# WoWSP pairing gateway — a Rust workspace compiled to WebAssembly for
# Cloudflare Workers (see README.md). This is a STANDALONE workspace:
# the repo root Cargo.toml EXCLUDES this directory, so the relay keeps
# its own Cargo.lock (gitignored, like every other lockfile here) and its
# wasm-only dependency tree never touches the app crates' builds.

[workspace]
resolver = "2"

members = ["crates/relay-core", "crates/relay-worker"]

# No default-members: `cargo check --target wasm32-unknown-unknown` and
# `cargo test -p relay-core` are the entry points (see `just check-relay`).

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license = "MIT"
description = "WoWSP pairing gateway — Cloudflare Worker (Rust → WebAssembly)"

[workspace.dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

# NOTE: no custom [profile.release] here on purpose. Size-focused
# overrides (opt-level "z" + fat LTO) produced a wasm that hung workerd
# on every request (verified against `wrangler dev`; a minimal worker on
# the default profile was fine) — stick to cargo's default release
# profile, exactly like the upstream workers-rs template.
