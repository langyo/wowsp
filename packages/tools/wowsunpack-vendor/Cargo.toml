# WoWSP's vendored replay/unpack toolchain — an INDEPENDENT IN-REPO FORK of
# wows-toolkit (declared 2026-10, slimmed to the consumed library crates
# the same month): this tree no longer tracks the upstream repository.
# Dependency bumps and fixes here are WoWSP's own; there is no upstream
# sync to preserve. The sources keep their historical formatting
# (exempt from the root fmt/clippy gates).
#
# WoWSP's ROOT workspace builds these two crates as members and serves
# their `workspace = true` inheritance from the ROOT's
# [workspace.dependencies]; the table below only applies when building
# from inside this directory (rare — keep both coherent when touching
# dependencies).
[workspace]
resolver = "3"
members = ["crates/wows-core", "crates/wowsunpack"]

[workspace.package]
version = "0.1.70"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
# Internal
wows-core = { version = "^0.11", path = "crates/wows-core", default-features = false }
# External — exactly the union the two crates pull via `workspace = true`
bon = "^3"
ciborium = "^0.2"
clap = { version = "^4", features = ["derive"] }
convert_case = "^0.11"
flate2 = { version = "^1", features = ["zlib-rs"], default-features = false }
gettext = "^0.4"
glob = "^0.3"
image = { version = "^0.25", default-features = false }
image_dds = { version = "^0.7", default-features = false }
indicatif = "^0.18"
insta = { version = "^1", features = ["yaml"] }
itertools = "^0.14"
paste = "^1"
pickled = { version = "^2.0.0-alpha9" }
rkyv = "^0.8"
rootcause = "^0.12"
roxmltree = "^0.21"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
sha2 = "^0.11"
thiserror = "^2"
toml = "^1"
tracing = "^0.1"
winnow = "^1"
