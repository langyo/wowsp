packages:
  - 'packages/webui'
  - 'packages/website'
  - 'packages/holo'
  # Vendored upstream checkout (see packages/hikari-vendor/VENDOR.md).
  - 'packages/hikari-vendor/packages/vue'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@lucide/vue@1.38.0'
overrides:
  postcss: ^8.5.18
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  # One vite-plugin resolution across the workspace, including the vendored
  # hikari checkout (whose "^*" specs otherwise keep stale lockfile picks).
  "@vitejs/plugin-vue": ^*
  "@vitejs/plugin-vue-jsx": ^*
