packages:
  - 'packages/webui'
  - 'packages/website'
  - 'packages/holo'
  - 'packages/pairing-relay'
  - 'packages/console'
# pnpm 11's release-age cutoff is only active once the base is set explicitly;
# `minimumReleaseAgeExclude` below is ignored wholesale without it, so the
# family-package exemptions listed there would never apply (frontend-pnpm).
minimumReleaseAge: 1440
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
  # wrangler's local dev runtime (packages/pairing-relay devDep only — the
  # worker itself is typechecked with tsc, never built locally).
  workerd: true
minimumReleaseAgeExclude:
  - '@lucide/vue@1.38.0'
  - '@celestia-island/hikari@0.40.18 || 0.55.34 || 0.55.36 || 0.55.53 || 0.55.74 || 0.55.75 || 0.55.128 || 0.55.131 || 0.55.133 || 0.55.176 || 0.55.177 || 0.55.182 || 0.55.191 || 0.55.193 || 0.55.202 || 0.55.214 || 0.55.215 || 0.55.224'
  - '@celestia-island/tairitsu-transport@0.1.0'
  # Patched versions of the 2026-10 dev-toolchain advisories (undici/sharp/
  # brace-expansion) are younger than the minimum-release-age window.
  # NOT listed: braces@3.0.4 — the advisory's patched version is unpublished
  # upstream (registry latest is 3.0.3), so GHSA-vfj7-8cjw-p6xm stays open
  # until the braces maintainer ships a release; no override is possible.
  - undici@7.29.1
  - sharp@0.35.5
  - brace-expansion@2.1.7 || 5.0.12
overrides:
  # All override values are coarse carets (repo policy: ^MAJOR, or ^0.MINOR
  # on 0.x lines) so resolution always tracks the newest release. The
  # SELECTORS below the patched lines keep the audit history readable; the
  # >=4.0.0 → ^5 force stays load-bearing because the 4.x line has no
  # patched release (5.0.12 is the fix). Resolutions can't fall back below
  # the patched versions: they are age-mature, so even minimumReleaseAge
  # filtering still exposes them as the newest eligible.
  postcss: ^8
  "brace-expansion@<1.1.18": ^1
  "brace-expansion@>=2.0.0 <2.1.7": ^2
  "brace-expansion@>=4.0.0 <5.0.12": ^5
  # Dev-toolchain audit wave 2026-10 (all devDependencies: wrangler/miniflare
  # undici chain, gltf-transform CLI sharp, minimatch brace-expansion chain).
  undici: ^7
  sharp: ^0.35
  js-yaml: ^4
  nanoid: ^3
  # Audit L-1: prod-dep advisories above `high` fail CI — these two chains
  # (vue-router→vite 8.3.0, vue→source-map-js) were the offenders.
  vite: ^8
  source-map-js: ^1
  # One vite-plugin resolution across the workspace.
  "@vitejs/plugin-vue": ^*
  "@vitejs/plugin-vue-jsx": ^*
