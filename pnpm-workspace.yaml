packages:
  - 'packages/webui'
  - 'packages/website'
  - 'packages/holo'
  # Vendored upstream checkout (see packages/hikari-vendor/VENDOR.md).
  - 'packages/hikari-vendor/packages/vue'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@lucide/vue@1.38.0'
overrides:
  postcss: ^8.5.18
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  # Align the vendored hikari checkout (declares "^*") with the workspace
  # plugins so every importer runs one plugin version against vite 8.
  "@vitejs/plugin-vue": ^6.0.8
  "@vitejs/plugin-vue-jsx": ^5.1.6
