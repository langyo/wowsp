packages:
  - 'packages/webui'
  - 'packages/website'
  - 'packages/holo'
  - 'packages/pairing-relay'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
  # wrangler's local dev runtime (packages/pairing-relay devDep only — the
  # worker itself is typechecked with tsc, never built locally).
  workerd: true
minimumReleaseAgeExclude:
  - '@lucide/vue@1.38.0'
  - '@celestia-island/hikari@0.40.18 || 0.55.34 || 0.55.36 || 0.55.53 || 0.55.74 || 0.55.75 || 0.55.128 || 0.55.131 || 0.55.133 || 0.55.176 || 0.55.177 || 0.55.182 || 0.55.191'
  - '@celestia-island/tairitsu-transport@0.1.0'
overrides:
  postcss: ^8.5.18
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  # Audit L-1: prod-dep advisories above `high` fail CI — these two chains
  # (vue-router→vite 8.3.0, vue→source-map-js) were the offenders.
  vite: ^8.3.4
  source-map-js: ^1.2.2
  # One vite-plugin resolution across the workspace.
  "@vitejs/plugin-vue": ^*
  "@vitejs/plugin-vue-jsx": ^*
