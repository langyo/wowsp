packages:
  - 'packages/webui'
  - 'packages/website'
  - 'packages/holo'
  - 'packages/installer-shell/web'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@lucide/vue@1.38.0'
  - '@celestia-island/hikari@0.40.18'
overrides:
  postcss: ^8.5.18
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  # One vite-plugin resolution across the workspace.
  "@vitejs/plugin-vue": ^*
  "@vitejs/plugin-vue-jsx": ^*
