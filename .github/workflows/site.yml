name: Deploy Site

# GitHub Pages is the BACKUP mirror of the site AND the origin every
# built asset of the live site loads from: the worker at
# https://wowsp.langyo.xyz serves only the HTML shell + the pairing API
# (/api), while JS/CSS/images/docs download from
# https://langyo.github.io/wowsp/… (GitHub's CDN). Consequence: this
# artifact must NOT carry a CNAME file — a CNAME (or a custom domain in
# the repo Pages settings) makes langyo.github.io/wowsp 301 back to the
# worker origin and the asset URLs circular. If the domain ever needs to
# come back, re-add the CNAME step and flip the bases below.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'packages/website/**'
      # The website consumes @wowsp/holo — a holo-only change must
      # redeploy the site.
      - 'packages/holo/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy per ref, never cancelled mid-flight: cancelling an in-progress
# Pages deploy loses it (GitHub's guidance is to let it finish; the next
# push simply queues behind this group).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site (docs + website)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install lagrange
        uses: dtolnay/rust-toolchain@stable
      - name: Build docs (lagrange)
        run: |
          cargo install lagrange-library --locked || cargo install --git https://github.com/celestia-island/lagrange --branch dev lagrange-library
          lagrange build --src docs --out _site/docs --site-url https://langyo.github.io/wowsp/docs

      - uses: pnpm/action-setup@v6
        # Version comes from the "packageManager" field in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build website
        env:
          # Pages serves this artifact as a PROJECT site at
          # /wowsp/ — the base must match or every route 404s.
          WOWSP_SITE_BASE: /wowsp/
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wowsp/website build
          cp -r dist/website/. _site/

      - name: No CNAME (must serve at langyo.github.io/wowsp/)
        run: rm -f _site/CNAME

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, and the
      # website router (createWebHistory) renders the right route from it.
      - name: SPA fallback (404.html)
        run: cp _site/index.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://langyo.github.io/wowsp/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
