name: Deploy Site

# Site artifact for GitHub Pages — the site host for wowsp.langyo.xyz,
# with the pairing worker taking only /api*, /feedback and /erp through
# its Cloudflare `routes` entry (see packages/pairing-relay/README.md ▶
# Site hosting model).
#
# TRANSITIONAL: the artifact is still built for the Pages PROJECT URL
# (https://langyo.github.io/wowsp/ — base `/wowsp/`, CNAME stripped). Do
# NOT bind the wowsp.langyo.xyz custom domain before the flip below, and
# never via the worker (a Workers Custom Domain captures the whole
# hostname and hides this site).
#
# Flip checklist (binding the custom domain):
#   1. drop WOWSP_SITE_BASE below (base `/`) and point lagrange's
#      --site-url at https://wowsp.langyo.xyz/docs (update the adjacent
#      comments too);
#   2. set the custom domain in the repo's Pages settings (Settings ▶
#      Pages ▶ Custom domain) — a CNAME file does nothing for
#      Actions-based Pages, which is why this workflow only strips it;
#   3. in the Cloudflare dashboard, remove the wowsp.langyo.xyz Workers
#      Custom Domain that captures the whole hostname today, and keep
#      the DNS as the proxied CNAME to langyo.github.io.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'packages/website/**'
      # The website consumes @wowsp/holo — a holo-only change must
      # redeploy the site.
      - 'packages/holo/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy per ref, never cancelled mid-flight: cancelling an in-progress
# Pages deploy loses it (GitHub's guidance is to let it finish; the next
# push simply queues behind this group).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site (docs + website)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install lagrange
        uses: dtolnay/rust-toolchain@stable
      - name: Build docs (lagrange)
        run: |
          cargo install lagrange-library --locked || cargo install --git https://github.com/celestia-island/lagrange --branch dev lagrange-library
          lagrange build --src docs --out _site/docs --site-url https://langyo.github.io/wowsp/docs
          # lagrange drops language-directory static assets, so the
          # per-language screenshot folders are copied in by hand (the
          # language dirs themselves don't exist in its output either —
          # hence the mkdir). The website gallery links
          # <siteBase>docs/<lang>/screenshots/*.webp, and the rendered
          # README pages reference ../screenshots/ from /docs/guides/ —
          # hence the default language also lands at /docs/screenshots/.
          for lang in en zh-CN zh-TW ja ko fr es ru; do
            mkdir -p "_site/docs/$lang"
            cp -r "docs/$lang/screenshots" "_site/docs/$lang/screenshots"
          done
          cp -r docs/en/screenshots _site/docs/screenshots

      - uses: pnpm/action-setup@v6
        # Version comes from the "packageManager" field in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build website
        env:
          # Pages serves this artifact as a PROJECT site at
          # /wowsp/ — the base must match or every route 404s.
          WOWSP_SITE_BASE: /wowsp/
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wowsp/website build
          cp -r dist/website/. _site/

      # Transitional guard: while the artifact targets the project URL, a
      # CNAME (or the Pages custom-domain setting) flips langyo.github.io/
      # wowsp into a redirect and breaks the /wowsp/ asset paths. See the
      # flip checklist in the banner comment.
      - name: No CNAME (project-URL artifact — see the banner)
        run: rm -f _site/CNAME

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, and the
      # website router (createWebHistory) renders the right route from it.
      - name: SPA fallback (404.html)
        run: cp _site/index.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://langyo.github.io/wowsp/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
