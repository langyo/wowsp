name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        # Version comes from the "packageManager" field in package.json
        # (pnpm 11 — workspace-level overrides live in pnpm-workspace.yaml).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Generate shader bundle
        run: python scripts/glsl_bundle.py --verbose
      - name: Generate Tauri icons
        run: python scripts/ensure_tauri_icons.py
      - name: Rustfmt
        # Only the app crates are in-repo code; wowsunpack/wows-core are
        # vendored wows-toolkit sources that keep upstream formatting.
        # Windows-only: windows-future 0.2.1 (pulled by tauri on Linux) fails
        # to compile on Linux (uses windows_core::imp::marshaler behind a
        # cfg(windows) gate — upstream bug, fixed in 0.3.x which the locked
        # windows 0.61 doesn't accept).
        if: runner.os == 'Windows'
        run: cargo fmt -p wowsp_tauri -p wowsp_tauri_shared -- --check
      - name: Clippy
        if: runner.os == 'Windows'
        # App crates only — vendored wowsunpack/wows-core are dependency-only.
        run: cargo clippy -p wowsp_tauri --bins -- -D warnings
      - name: Check
        if: runner.os == 'Windows'
        run: cargo check -p wowsp_tauri
      - name: Test (backend)
        if: runner.os == 'Windows'
        run: cargo test -p wowsp_tauri
      - name: Frontend typecheck
        run: pnpm -r typecheck
      - name: Frontend lint
        run: pnpm -r lint
      - name: Website build
        run: pnpm --filter @wowsp/website build
      - name: i18n parity
        run: python scripts/check_i18n.py --no-fail
      - name: npm audit
        # Dev-toolchain advisories (e.g. brace-expansion chains) have
        # tripped `high` before; production deps stay gated at `critical`.
        run: pnpm audit --audit-level=critical
      # cargo-deny is disabled until its dockerized action can run with the
      # pinned toolchain + deny.toml (see PLAN.md); pnpm audit covers npm.
