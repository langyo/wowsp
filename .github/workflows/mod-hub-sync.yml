name: Mod Hub Sync

# Keeps the Aslain-ingested half of the Mod Hub catalog current: content-
# addressed asset re-hosting, incremental thread updates, the crawled
# mod-index.json, and the relay's signed mod-hub digest. The design
# (stateless reconciliation, per-entry version semantics, two-phase
# delisting, safety gates) lives in docs/en/designs/mod-hub.md §7; the
# engine is scripts/mod_hub_sync.py. The maintainer's manual ingest
# pipeline (scripts/mod_hub_publish.py stages) stays available alongside.

on:
  schedule:
    - cron: "23 */6 * * *" # the upstream rebuilds at any hour; 4 checks a day is plenty
  workflow_dispatch:
    inputs:
      mode:
        description: "detect = read-only report; apply = full sync; index-only = republish the index"
        type: choice
        default: detect
        options:
          - detect
          - apply
          - index-only
      include_new:
        description: "apply only: also publish new upstream entries whose slugs are curated"
        type: boolean
        default: false

# One sync at a time -- a half-applied catalog must never interleave with
# another run's clobber uploads.
concurrency:
  group: mod-hub-sync
  cancel-in-progress: false

permissions:
  contents: write      # release asset uploads and the digest branch
  discussions: write   # the thread create/update mutations
  issues: write        # the failure alarm (reports are job summaries; repo
                       # changes land as squash-merged PRs -- the digest PR
                       # below -- never as issues)
  actions: write       # dispatching ci.yml / commit-msg-lint.yml / site.yml for the digest PR
  pull-requests: write # the digest bot PR's list/create/merge calls; the PR ops themselves
                       # run on RELEASE_OPS_TOKEN (this repo forbids GITHUB_TOKEN from
                       # creating PRs -- release.yml's #1416 note), this grant only keeps
                       # the github.token fallback path functional

jobs:
  sync:
    name: Sync the Mod Hub catalog
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
            # Token ladder for Discussion mutations: MODHUB_SYNC_TOKEN (optional PAT
      # with Discussions write), then RELEASE_OPS_TOKEN, then github.token.
      # The first scheduled apply proved GITHUB_TOKEN cannot run Discussion      # mutations (Resource not accessible by integration) even with the      # discussions: write grant -- REST reads and issue writes still work.
      GH_TOKEN: ${{ secrets.MODHUB_SYNC_TOKEN || secrets.RELEASE_OPS_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install p7zip (the 7z repack path)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Offline selftests first
        run: |
          python3 scripts/mod_hub_publish.py selftest
          python3 scripts/mod_index.py --selftest
          python3 scripts/mod_hub_sync.py selftest

      - name: Sync (schedule defaults to apply)
        id: sync
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            mode="apply"   # the schedule keeps the catalog current unattended
          fi
          if [ "$mode" = "apply" ]; then
            args=(--json sync-report.json)
            if [ "${{ inputs.include_new }}" = "true" ]; then
              args+=(--include-new)
            fi
            python3 scripts/mod_hub_sync.py apply "${args[@]}"
          elif [ "$mode" = "index-only" ]; then
            python3 scripts/mod_hub_sync.py index-only --json sync-report.json
          else
            python3 scripts/mod_hub_sync.py detect --json sync-report.json
          fi

      # The report lives in the job summary (plus sync-report.json). No
      # tracking issue: the former fixed-title sync-report issue channel
      # was removed (2026-11; the removal story lives in the mod-hub
      # design doc) -- repo work is announced through squash-merged PRs
      # with gitmoji titles, and repo-visible sync output (the digest PR
      # below) already lands that way.
      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f sync-report.json ]; then
            echo "no sync report this run (the failure happened before any stage ran)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/mod_hub_sync.py render-summary --json sync-report.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Second official digest channel (the mirror-crosscheck trust anchor):
      # after the index bytes change, re-point the relay's signed mod-hub
      # doc. The first doc for a channel must land together with its
      # wrangler.toml negations (build_worker_site.py's drift guard enforces
      # it), so this step edits both into one bot PR, squash-merges it green,
      # dispatches the site deploy and verifies the live endpoint -- the
      # exact pattern of release.yml's app digest job, minus the tag variable.
      - name: Re-point the relay digest
        if: success()
        env:
          WOWSP_DIGEST_SIGNING_KEY: ${{ secrets.WOWSP_DIGEST_SIGNING_KEY }}
          WOWSP_DIGEST_SIGNING_KEY_ID: ${{ vars.WOWSP_DIGEST_SIGNING_KEY_ID }}
          GH_TOKEN: ${{ secrets.RELEASE_OPS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          changed="$(python3 -c 'import json; print("yes" if json.load(open("sync-report.json"))["actions"]["index_changed"] else "no")')"
          sha="$(python3 -c 'import json; print(json.load(open("sync-report.json"))["actions"]["index_sha256"])')"
          # Re-point not only when THIS run changed the index: a run that died
          # between the index upload and this step (2026-11-06: a quoting bug
          # below) would otherwise leave the relay's cross-check pinning stale
          # bytes forever, because later runs see an unchanged index. Compare
          # the live digest document with the index this run just published.
          live_sha="$(curl -fsSL --max-time 20 "https://wowsp.langyo.xyz/api/digests/mod-hub" \
            | python3 -c 'import json,sys; print((json.load(sys.stdin).get("assets") or {}).get("mod-index.json",""))' 2>/dev/null || true)"
          if [ "$changed" != "yes" ] && [ "$live_sha" = "$sha" ]; then
            echo "index bytes unchanged and the relay digest already pins them -- nothing to do"
            exit 0
          fi
          echo "digest re-point needed (index changed=$changed, live='${live_sha:-unreachable}', want=$sha)"
          python3 scripts/publish_digests.py --channel mod-hub --tag mod-hub \
            --assets "mod-index.json=$sha" --latest --require-signed
          python3 - <<'PY'
          # First-doc lane: the negations and the published-channels var
          # ride the same commit as the first doc (idempotent on reruns).
          # The replace targets pin the CURRENT master shapes (the app+data
          # list as of 2026-11): when a new channel lands and reshapes the
          # line again, update these literals in the same PR -- the
          # build_worker_site.py drift guard fails the deploy loudly if the
          # negations ever go missing, so rot cannot ship silently.
          import pathlib
          p = pathlib.Path("packages/pairing-relay/wrangler.toml")
          s = p.read_text(encoding="utf-8")
          if "!/api/digests/mod-hub" not in s:
              s = s.replace(
                  'run_worker_first = ["/api*", "!/api/digests/app", "!/api/digests/app/*",'
                  ' "!/api/digests/data", "!/api/digests/data/*", "/gateway*"]',
                  'run_worker_first = ["/api*", "!/api/digests/app", "!/api/digests/app/*",'
                  ' "!/api/digests/data", "!/api/digests/data/*",'
                  ' "!/api/digests/mod-hub", "!/api/digests/mod-hub/*", "/gateway*"]')
          if 'DIGEST_PUBLISHED_CHANNELS = "app,data"' in s:
              s = s.replace('DIGEST_PUBLISHED_CHANNELS = "app,data"',
                            'DIGEST_PUBLISHED_CHANNELS = "app,data,mod-hub"')
          p.write_text(s, encoding="utf-8")
          PY
          branch="chore/mod-hub-digest"
          rm -rf repo
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" -b master repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          mkdir -p packages/pairing-relay/digests/mod-hub
          cp -a ../packages/pairing-relay/digests/mod-hub/. packages/pairing-relay/digests/mod-hub/
          cp ../packages/pairing-relay/wrangler.toml packages/pairing-relay/wrangler.toml
          seq="$(python3 -c 'import json; print(json.load(open("packages/pairing-relay/digests/mod-hub/latest.json"))["seq"])')"
          git add packages/pairing-relay
          if git diff --cached --quiet; then
            echo "digest doc already at seq $seq -- nothing to commit"
          else
            git commit -q -m "📦 Publish the mod-hub digest doc." \
              -m "Generated by the Mod Hub Sync workflow (scripts/publish_digests.py --channel mod-hub): the relay's mod-hub channel must re-point whenever the crawled index bytes change, or clients with both channels reachable keep their stale cache."
            git fetch -q origin "$branch" || true
            git push -q --force-with-lease origin "$branch"
          fi
          pr="$(gh pr list --head "$branch" --base master --json number --jq '.[0].number')"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            url="$(gh pr create --title "📦 Publish the mod-hub digest doc." --base master \
              --body "Automated relay-digest publish from the Mod Hub Sync workflow: mod-hub/latest.json seq bumped, signed with the app-pinned key, asset table byte-matches the release API. Merged automatically once CI is green; the Deploy Site workflow then ships it.")"
            pr="${url##*/}"
          fi
          echo "digest PR #$pr (seq $seq)"
          gh workflow run ci.yml --ref "$branch"
          gh workflow run commit-msg-lint.yml --ref "$branch" -f pr="$pr"
          sleep 60
          # Poll per-check states through the check-runs API instead of
          # `gh pr checks`'s aggregate exit code: rc=8 only says "something
          # is not green", so during the 2026-11-10..12 outage the FAILED
          # E2E job masqueraded as "waiting" behind the forever-queued
          # type-escapes reusable job (org self-hosted runner congestion,
          # AGENTS.md §8.2's environmental class) and the loop spun its
          # whole budget before dying with the generic stuck message.
          sha="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          check_classes() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --jq '
              {failed:   [.check_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .name] | join(", "),
               running:  [.check_runs[] | select(.status == "in_progress") | .name] | join(", "),
               queued:   [.check_runs[] | select(.status == "queued") | .name] | join(", "),
               total:    (.check_runs | length)}'
          }
          merged=0
          for attempt in $(seq 1 80); do
            set +e
            classes="$(check_classes)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] || [ -z "$classes" ]; then
              echo "check-runs poll failed (rc=$rc) -- retrying (attempt $attempt/80)"
              sleep 30
              continue
            fi
            total="$(echo "$classes" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
            failed="$(echo "$classes" | python3 -c 'import json,sys; print(json.load(sys.stdin)["failed"])')"
            running="$(echo "$classes" | python3 -c 'import json,sys; print(json.load(sys.stdin)["running"])')"
            queued="$(echo "$classes" | python3 -c 'import json,sys; print(json.load(sys.stdin)["queued"])')"
            if [ -n "$failed" ]; then
              echo "::error::digest PR #$pr check(s) FAILED (code-level, never waivable): $failed"
              exit 1
            fi
            if [ "${total:-0}" -gt 0 ] && [ -z "$running" ] && [ -z "$queued" ]; then
              gh pr merge "$pr" --squash --delete-branch
              merged=1
              break
            fi
            echo "digest PR checks not final yet (running: ${running:-none}; queued: ${queued:-none}) (attempt $attempt/80)"
            sleep 30
          done
          if [ "$merged" -ne 1 ]; then
            # Environmental waiver (AGENTS.md §5.2/§8.2): a check that is
            # still non-final after the whole ~40-minute budget -- the org
            # self-hosted type-escapes node congestion again (2026-11-10..12:
            # the reusable job sat QUEUED for days while every hosted job
            # finished in minutes; its started_at is set even though no
            # runner ever picked it up, so elapsed time is the only sound
            # discriminator) -- while every check that DID conclude finished
            # green and nothing failed. Any job that actually ran carries
            # its own timeout-minutes (<= 30) and would have been marked
            # failed long before this budget expires, so a non-final check
            # here is by elimination a runner-infrastructure state. The
            # digest doc is machine-generated JSON plus one wrangler.toml
            # line and carries its own gates (publish_digests.py
            # --require-signed, the release-API asset byte-match, the
            # relay/versions jobs), so the stuck job's verdict is waived ON
            # RECORD: the waiver is posted on the PR before merging.
            classes="$(check_classes)"
            failed="$(echo "$classes" | python3 -c 'import json,sys; print(json.load(sys.stdin)["failed"])')"
            stuck="$(echo "$classes" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(", ".join(x for x in (d["queued"], d["running"]) if x))')"
            if [ -n "$failed" ]; then
              echo "::error::digest PR #$pr never merged (failed: $failed) -- checks stuck?"
              exit 1
            fi
            if [ -z "$stuck" ]; then
              echo "::error::digest PR #$pr never merged and nothing outstanding -- state $(gh pr view "$pr" --json state --jq .state)?"
              exit 1
            fi
            gh pr comment "$pr" --body "Environmental waiver (AGENTS.md §8.2): **${stuck}** never left the queue after the full wait budget (self-hosted runner congestion). Every check that ran is green and nothing failed. Merging on the digest doc's own gates: the signed publish, the release-API asset byte-match, and the relay/versions jobs."
            gh pr merge "$pr" --squash --delete-branch
          fi
          # Merge guard (the #1782 conflict resolution dropped the #1767
          # original and #1796 restored it): dispatching the site deploy
          # without the doc merged wastes the whole live-poll window on a
          # guaranteed miss -- the 2026-11-07 00:40 run died exactly there.
          state="$(gh pr view "$pr" --json state --jq .state)"
          if [ "$state" != "MERGED" ]; then
            echo "::error::digest PR #$pr never merged (state $state) -- checks stuck?"
            exit 1
          fi
          gh workflow run site.yml --ref master
          for attempt in $(seq 1 40); do
            read="$(curl -fsSL --max-time 20 "https://wowsp.langyo.xyz/api/digests/mod-hub" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("tag",""), d.get("seq",0))' 2>/dev/null || true)"
            tag="$(echo "$read" | awk '{print $1}')"
            seq_live="$(echo "$read" | awk '{print $2}')"
            if [ "$tag" = "mod-hub" ] && [ "${seq_live:-0}" -ge "$seq" ] 2>/dev/null; then
              echo "live /api/digests/mod-hub serves mod-hub at seq $seq_live (attempt $attempt/40)"
              exit 0
            fi
            echo "live is '${read:-unreachable}', want tag=mod-hub seq>=$seq (attempt $attempt/40)"
            sleep 60
          done
          echo "::error::live /api/digests/mod-hub never re-pointed"
          exit 1

      # The failure alert is the one issue this workflow still posts: an
      # actionable incident signal on an unattended schedule (the `issue`
      # subcommand dedupes onto the single open alert issue), not a report.
      - name: Alarm on failure
        if: failure()
        env:
          # GITHUB_TOKEN's issues:write grant is what the alarm needs;
          # RELEASE_OPS_TOKEN may be a fine-grained PAT without Issues
          # permission and used to fail this step (2026-11-06 run).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Mod Hub sync failed -- the catalog needs a look"
          bodyfile="$(mktemp)"
          cat > "$bodyfile" <<EOF
          The Mod Hub Sync workflow failed. Safety notes: assets and threads may be ahead of the index (safe -- the old catalog stays servable), and a failed index publish rolls back to the previous bytes automatically. Re-run via Actions (Mod Hub Sync, mode=apply) or locally with python scripts/mod_hub_sync.py apply.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          python3 scripts/mod_hub_sync.py issue --title "$title" --body-file "$bodyfile"
