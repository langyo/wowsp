name: Commit Message Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages
        run: |
          set -e
          base="origin/${GITHUB_BASE_REF:-master}"
          git fetch origin "${GITHUB_BASE_REF:-master}" --quiet || true
          git log --no-merges --format='%s' "$base..HEAD" | while read -r msg; do
            [ -z "$msg" ] && continue
            # <gitmoji> <Capitalized English summary.> (ends with a period)
            if ! printf '%s' "$msg" | grep -qP '^\p{So}[\p{Mn}\p{Me}]*\s+[A-Z].*\.$'; then
              echo "Invalid commit message: $msg" >&2
              exit 1
            fi
          done
