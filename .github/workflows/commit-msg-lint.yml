name: Commit Message Lint

# One in-flight run per pull request (ci-ops 8.3.3): a superseded push cancels
# its predecessor instead of queueing a second lint behind it on the lane the
# repository resolves — which, on the farm, means one slot instead of many.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]
  merge_group:
    types: [checks_requested]
  # Fallback entry for the CNB lane (or an operator): dispatch this workflow on
  # the pull request's head branch, so the single required check is served by
  # the lane that can actually run. See the devtools callee for the lane rules.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to lint"
        required: true
        type: string

permissions:
  # A called workflow cannot grant itself a permission the caller withholds —
  # the mismatch reads as startup_failure. The org default token permissions
  # were tightened on 2026-10-02 and this caller was missed, so the single
  # required check stopped reporting entirely. Grant exactly what the reusable
  # lint declares and nothing more.
  contents: read
  pull-requests: read

jobs:
  # A squash merge turns the PR title into the master commit subject, so the
  # reusable lint's bot-author exemption must not ship non-compliant subjects
  # from dependabot (16 of the 20 bot PRs merged so far landed a bare
  # "Bump x from y to z" subject). This normalizes dependabot titles to the
  # "⬆️ <title>." house form — the shape the three manually-retitled bot PRs
  # already used — and fails the run when a bot title cannot be expressed
  # compliantly, so the gap surfaces instead of merging silently. Human PRs
  # are untouched: the reusable lint owns their validation. Note the retitle
  # fires the `edited` trigger once; the re-run is a no-op by design.
  normalize-bot-title:
    if: >-
      github.event_name == 'pull_request' &&
      endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Retitle the bot PR into compliance
        run: python scripts/retitle_bot_pr.py --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}

  lint-commits:
    uses: celestia-island/celestia-devtools/.github/workflows/commit-msg-lint.yml@2e76d373762dc6b36c1ab7625c1c34842c28ad4a
    with:
      devtools-ref: 2e76d373762dc6b36c1ab7625c1c34842c28ad4a
      # Lane switch without touching this tree: the org variables resolve to the
      # self-hosted fleet while the hosted lane is down (2026-09-24 account
      # payments: a job sent there sits fifteen minutes with no runner before
      # being cancelled, indistinguishable from "the check never reports").
      runner: ${{ vars.LINT_RUNNER || '["ubuntu-latest"]' }}
      lane: ${{ vars.LINT_LANE || 'hosted' }}
      pr: ${{ inputs.pr }}
