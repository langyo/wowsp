[workspace]
resolver = "2"

default-members = [
    "packages/app/tauri",
]

members = [
    "packages/app/tauri",
    "packages/app/tauri_shared",
    "packages/installer-shell",
    "packages/tools/wowsunpack-vendor/crates/wowsunpack",
    "packages/tools/wowsunpack-vendor/crates/wows-core",
]

exclude = [
    "packages/webui",
    # Standalone Rust workspace compiled to wasm for Cloudflare Workers —
    # keeps its own Cargo.lock (gitignored) and its worker/wasm-bindgen
    # dependency tree out of the app crates' builds. Entry points:
    # `just check-relay`, or `cargo check --target wasm32-unknown-unknown`
    # / `cargo test -p relay-core` inside packages/pairing-relay.
    "packages/pairing-relay",
]

[workspace.package]
version = "0.4.8"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license = "MIT"
description = "World of WarShip Panel — replay review & in-game overlay"
repository = "https://github.com/langyo/wowsp"

[workspace.dependencies]

# Workspace internal crate aliases
wowsp_tauri_shared = { path = "packages/app/tauri_shared" }

# Core language and utilities
anyhow = "^1"
async-trait = "^0.1"
thiserror = "^2"
# Data and serialization
chrono = { version = "^0.4", features = ["serde", "clock"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
toml = "1.1"
uuid = { version = "^1", features = ["v4", "serde"] }

# OS randomness for the pairing server's PIN/token minting. Already in the
# lockfile via tempfile/uuid; a direct dependency adds no new crate.
getrandom = "^0.4"

# Pairing relay transport (mobile client + desktop host bridge): WebSocket
# tunnel to the Cloudflare Worker in packages/pairing-relay. rustls carries
# the wss:// legs; the ring provider (installed process-wide where needed)
# keeps aws-lc-rs off every build machine.
tokio-tungstenite = { version = "^0.30", default-features = false, features = [
    "connect",
    "handshake",
    "url",
    "rustls-tls-webpki-roots",
] }
rustls = { version = "^0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }

# Logging and tracing
tracing = { version = "^0.1", features = ["log"] }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# Async / concurrent runtime
futures = "^0.3"
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "fs", "sync", "signal"] }

# Networking (WG API lookups, mod catalog + model pack downloads).
# native-tls = SChannel on Windows: reqwest 0.13 renamed `rustls-tls` →
# `rustls`, which now pins aws-lc-rs (needs NASM/CMake on every build
# machine) — not worth it for the Windows desktop build. Android cannot use
# native-tls (no system OpenSSL), so the app crate swaps in a ring-provider
# rustls build via a per-target dependency table (see packages/app/tauri).
reqwest = { version = "^0.13", default-features = false, features = [
    "json",
    "native-tls",
    "stream",
    "charset",
    "http2",
] }

# File system watching (poll tempArenaInfo.json, replay dir, dev hot-reload)
notify = "^7"

# Replay packet-stream decryption (Blowfish ECB + zlib). The WoWS replay
# payload is Blowfish-encrypted with a hardcoded 16-byte game key, XOR-chained
# across 8-byte blocks, then zlib-compressed — see Monstrofil/replays_unpack.
# blowfish 0.10 carries a ByteOrder type param (PyCryptodome uses big-endian,
# the crate default); pin byteorder so we can name `BigEndian` explicitly.
blowfish = "^0.10"
byteorder = "^1"
flate2 = { version = "^1", features = ["zlib-rs"] }
tar = "^0.4"

# Mod Hub package unpacking (catalog zips); tauri's updater already pulls zip 8
zip = { version = "^8", default-features = false, features = ["deflate"] }

# Service supervision — graceful shutdown / signal handling (same usage as
# shittim-chest: DrainController + SignalExitSource for canonical Ctrl-C /
# window-close lifecycle). Published to crates.io.
malkuth = { version = "^0.2", default-features = false, features = ["signals"] }

# Windows registry scanning for game install detection (official / Lesta / 360)
winreg = "^0.56"

# Windows screen capture for overlay roster positioning; Media_Ocr and its
# support namespaces power the on-device tab row OCR (row_ocr_windows).
windows = { version = "^0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    # ShellExecuteW: open_external hands http(s) URLs to the default browser.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
    # Row OCR (Windows.Media.Ocr): pixel write access into a SoftwareBitmap
    # (Win32_System_WinRT's IMemoryBufferByteAccess), the bitmap itself
    # (Graphics_Imaging), recognizer-language selection (Globalization) and
    # the user-language-list fallback (System_UserProfile).
    "Win32_System_WinRT",
    "Graphics_Imaging",
    "Globalization",
    "System_UserProfile",
    "Media_Ocr",
] }

# Image handling for capture analysis
image = { version = "^0.25", default-features = false, features = ["png"] }

# Encoding helpers
base64 = "^0.23"
hex = "^0.4"

# Tauri shell. tray-icon + image-png are desktop-only features and are added
# by the app crate's desktop target table (no system tray on Android), so the
# shared definition stays feature-free apart from what every shell needs.
tauri = { version = "^2" }
tauri-build = "^2"
tauri-plugin-updater = "^2"

# AppData directory resolution (cross-platform %APPDATA%)
dirs-next = "^2"

# wowsunpack / wows-core vendor deps (inherited via workspace = true)
wows-core = { path = "packages/tools/wowsunpack-vendor/crates/wows-core", default-features = false }
# In-app GameParams unpacking: vfs-mmap = idx/pkg VFS over the game install
# (parsing + arc come in transitively). The `bin` CLI feature stays off.
wowsunpack = { path = "packages/tools/wowsunpack-vendor/crates/wowsunpack", default-features = false, features = [
    "vfs-mmap",
] }
# Native folder picker for manual game-path selection (Windows IFileDialog).
rfd = { version = "0.16", default-features = false }
clap = { version = "4.6.0", features = ["derive"] }
rootcause = "0.12"
glob = "0.3"
pickled = { version = "2.0.0-alpha9" }
winnow = "1.0"
paste = "1"
roxmltree = "0.21"
itertools = "0.14"
gettext = "0.4"
convert_case = "0.12"
indicatif = "0.18.4"
rkyv = "0.8.15"
bon = "3.9.1"
image_dds = { version = "0.7", default-features = false }
ciborium = "0.2"
insta = { version = "1.47", features = ["yaml"] }
sha2 = "0.10"

# ── Build profiles ──────────────────────────────────────────

[profile.dev]
debug = 1
opt-level = 0
strip = "none"

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[profile.bench]
debug = 0
