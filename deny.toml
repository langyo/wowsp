# WoWSP ships Windows desktop (tauri x86_64-pc-windows-msvc) + Android
# (tauri aarch64-linux-android); restrict checks to those targets so tauri's
# Linux-only stack (gtk-rs etc.) stays out of license/advisory scope.
[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
# Org convention (arona): only flag advisories for workspace-member crates;
# transitive unmaintained noise (instant, paste, unic-*, …) is not actionable.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained but functional; it is a direct dependency of the vendored wows-toolkit sources (packages/tools/game-assets tree). The vendor tree is now WoWSP's own independent fork (2026-10 decision — no upstream sync), so swapping in the drop-in pastey fork is unblocked whenever wanted; not urgent while paste keeps compiling."


# zstd 0.13.x: the 2026-10 advisory batch (0391 context-reuse leak, 0398
# seekable decompress overflow, 0403 legacy-frame uninitialized memory,
# 0410 wasm allocator shim) — fixed in zstd 0.14.3 / zstd-safe 8.2.0.
# replay-drain decompresses user-supplied replays with these crates, so
# upgrading is REQUIRED, not optional: do it as soon as registry access is
# available (cargo update -p zstd -p zstd-safe, replay-drain/shun API port
# for the 0.13 -> 0.14 streaming changes), then delete all four entries.
[[advisories.ignore]]
id = "RUSTSEC-2026-0391"
reason = "zstd 0.13.3 stream-context reuse can leak abandoned-session data; our consumers (replay-drain, shun) decompress single-shot streams per replay file and do not reuse contexts across untrusted inputs. Fix: upgrade zstd >= 0.14.3 — blocked on registry access in this environment; tracked as the immediate follow-up."
[[advisories.ignore]]
id = "RUSTSEC-2026-0398"
reason = "zstd-safe 7.3.0 seekable decompress can set_len past capacity on out-of-range offsets (seekable feature). Our replay parsing does not enable the seekable feature; the advisory is inherited transitively. Fix: upgrade zstd-safe >= 8.2.0 with the zstd 0.14 line."
[[advisories.ignore]]
id = "RUSTSEC-2026-0403"
reason = "zstd 0.13.3 legacy-frame streaming failure can expose uninitialized memory in Vec destinations. Legacy frames pre-date zstd 0.4 and do not occur in current replays, but replay-drain leaves the default enabled. Fix: upgrade zstd >= 0.14.3."
[[advisories.ignore]]
id = "RUSTSEC-2026-0410"
reason = "zstd 0.13.3 wasm allocator shim corrupts memory on allocation failure; the shim is only compiled for wasm32 targets, which none of our crates build. Fix: upgrade zstd >= 0.14.3."

# (The RUSTSEC-2026-0381 ignore for webpki-roots 0.26 was removed: the
# (The RUSTSEC-2026-0381 ignore for webpki-roots 0.26 was removed: the
# advisory DB no longer matches any crate in the tree — the shipped
# webpki-roots 0.26.11 stopped being flagged — and cargo-deny fails on
# unused ignores. Re-add only if the advisory regains coverage.)
[licenses]
# Removed keys (vulnerability/notice/unlicensed/copyleft/default) are built
# in since cargo-deny PR #611: unallowed licenses deny, everything else warns.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 — clipboard-win (egui's Windows clipboard).
    "BSL-1.0",
    # Embedded font licenses — epaint_default_fonts (egui's default fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Synthetic Source License 1.0 — malkuth ships it via license-file;
    # LicenseRef- form for the unregistered SPDX term (org convention).
    "LicenseRef-sysl-1.0",
]
confidence-threshold = 0.8
# WoWSP's own crates carry `license = "SySL-1.0"` (raw string, not a
# registered SPDX id). They are private, never-published app crates
# (`publish = false`), so skip them instead of naming an unknown SPDX term.
private = { ignore = true }

# malkuth declares `license-file = "LICENSE"` (no SPDX expression), so
# clarify it from the license file itself (SySL-1.0, same license as WoWSP).
[[licenses.clarify]]
name = "malkuth"
expression = "LicenseRef-sysl-1.0"
license-files = [{ path = "LICENSE", hash = 0xda2b7c13 }]

# shun declares `license-file = "LICENSE"` (no SPDX expression), so
# clarify it from the license file itself (SySL-1.0, same license as WoWSP).
[[licenses.clarify]]
name = "shun"
expression = "LicenseRef-sysl-1.0"
license-files = [{ path = "LICENSE", hash = 0xda2b7c13 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
