# WoWSP ships Windows desktop (tauri x86_64-pc-windows-msvc) + Android
# (tauri aarch64-linux-android); restrict checks to those targets so tauri's
# Linux-only stack (gtk-rs etc.) stays out of license/advisory scope.
[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
# Org convention (arona): only flag advisories for workspace-member crates;
# transitive unmaintained noise (instant, paste, unic-*, …) is not actionable.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained but functional, and is a direct dependency of the vendored wows-toolkit sources (packages/tools/wowsunpack-vendor) which we keep in sync with upstream — swapping in the pastey fork would fork the vendor diff. Revisit when upstream wows-toolkit migrates."

[licenses]
# Removed keys (vulnerability/notice/unlicensed/copyleft/default) are built
# in since cargo-deny PR #611: unallowed licenses deny, everything else warns.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 — clipboard-win (egui's Windows clipboard).
    "BSL-1.0",
    # Embedded font licenses — epaint_default_fonts (egui's default fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Synthetic Source License 1.0 — malkuth ships it via license-file;
    # LicenseRef- form for the unregistered SPDX term (org convention).
    "LicenseRef-sysl-1.0",
]
confidence-threshold = 0.8
# WoWSP's own crates carry `license = "SySL-1.0"` (raw string, not a
# registered SPDX id). They are private, never-published app crates
# (`publish = false`), so skip them instead of naming an unknown SPDX term.
private = { ignore = true }

# malkuth declares `license-file = "LICENSE"` (no SPDX expression), so
# clarify it from the license file itself (SySL-1.0, same license as WoWSP).
[[licenses.clarify]]
name = "malkuth"
expression = "LicenseRef-sysl-1.0"
license-files = [{ path = "LICENSE", hash = 0xda2b7c13 }]

# shun declares `license-file = "LICENSE"` (no SPDX expression), so
# clarify it from the license file itself (SySL-1.0, same license as WoWSP).
[[licenses.clarify]]
name = "shun"
expression = "LicenseRef-sysl-1.0"
license-files = [{ path = "LICENSE", hash = 0xda2b7c13 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
